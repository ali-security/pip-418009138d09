name: MacOS

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: Optional pytest selector to scope the test run (empty runs the full suite)
        required: false
        default: ''

jobs:
  dev-tools:
    name: Quality Check
    runs-on: macos-latest
    timeout-minutes: 30


    steps:
    # Caches
    # actions/cache@v1 is hard-failed by GitHub before any step runs
    # ("uses a deprecated version of 'actions/cache: v1'"), so v4 here is what
    # lets this job start at all.
    - name: pip cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('tools/requirements/tests.txt') }}-${{ hashFiles('tools/requirements/docs.txt') }}-${{ hashFiles('tox.ini') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          ${{ runner.os }}-
    - name: Set PY (for pre-commit cache)
      run: echo "PY=$(python -c 'import hashlib, sys;print(hashlib.sha256(sys.version.encode()+sys.executable.encode()).hexdigest())')" >> $GITHUB_ENV
    - name: pre-commit cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/pre-commit
        key: pre-commit|2020-02-14|${{ env.PY }}|${{ hashFiles('.pre-commit-config.yaml') }}

    # Setup
    - uses: actions/checkout@v2
    # macos-latest now resolves to macos-26-arm64 and actions/python-versions
    # ships no darwin-arm64 build of CPython 3.8, so actions/setup-python@v2
    # cannot provision it. This drop-in builds the interpreter from source when
    # no prebuilt exists -- the tests job already relies on it for macOS 3.8/3.9.
    - name: Set up Python 3.8
      uses: MatteoH2O1999/setup-python@v4
      with:
        python-version: 3.8
        allow-build: info
        cache-build: true

    - name: Install tox
      # tox 3: tox.ini uses `whitelist_externals` (renamed in tox 4) and the
      # tests job's tox-venv plugin imports tox.venv, which tox 4 removed.
      # Release-date index, scoped to this step: at job level it also reaches
      # setup-python's internal `pip install --upgrade pip`, which downgrades
      # the runner's own pip in place and leaves a broken hybrid install
      # (ImportError: InvalidSchemeCombination). Only project dependency
      # resolution belongs on the snapshot.
      env:
        PIP_INDEX_URL: https://:2021-01-23T12%3A58%3A09.936803Z@time-machines-pypi.sealsecurity.io/
      # setuptools<52 (51.3.3 in the snapshot) pairs with the packaging 20.8
      # that tox 3 resolves: a present-day setuptools calls
      # canonicalize_version(strip_trailing_zero=...), which packaging<22 has
      # no such keyword for, so `setup.py sdist` dies in tox's sdist-make.
      run: python -m pip install 'tox<4' 'setuptools<52'

    # Main check
    - name: Run lint and docs
      # Release-date index, scoped to this step: at job level it also reaches
      # setup-python's internal `pip install --upgrade pip`, which downgrades
      # the runner's own pip in place and leaves a broken hybrid install
      # (ImportError: InvalidSchemeCombination). Only project dependency
      # resolution belongs on the snapshot.
      env:
        PIP_INDEX_URL: https://:2021-01-23T12%3A58%3A09.936803Z@time-machines-pypi.sealsecurity.io/
        # pre-commit builds ruamel.yaml.clib from source here: the snapshot has
        # no arm64 macOS wheel for it, and clang 16 turned
        # incompatible-function-pointer-types (which its 2021 C generates against
        # libyaml's unsigned char* handlers) from a warning into an error.
        CFLAGS: -Wno-incompatible-function-pointer-types
      run: python -m tox -e "lint,docs"

  packaging:
    name: Packaging
    runs-on: macos-latest
    timeout-minutes: 30


    steps:
    # Caches
    # actions/cache@v1 is hard-failed by GitHub before any step runs, which is
    # why this job never reached its first step; v4 is the supported version.
    - name: pip cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('tools/requirements/tests.txt') }}-${{ hashFiles('tools/requirements/docs.txt') }}-${{ hashFiles('tox.ini') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          ${{ runner.os }}-
    # Setup
    - name: Set up git credentials
      run: |
        git config --global user.email "pypa-dev@googlegroups.com"
        git config --global user.name "pip"
    - uses: actions/checkout@v2
    # Same arm64 constraint as the Quality Check job: no darwin-arm64 CPython
    # 3.8 exists in actions/python-versions, so build it from source instead.
    - name: Set up Python 3.8
      uses: MatteoH2O1999/setup-python@v4
      with:
        python-version: 3.8
        allow-build: info
        cache-build: true
    - name: Install tox and nox
      # tox 3: tox.ini uses `whitelist_externals` (renamed in tox 4) and the
      # tests job's tox-venv plugin imports tox.venv, which tox 4 removed.
      # Release-date index, scoped to this step: at job level it also reaches
      # setup-python's internal `pip install --upgrade pip`, which downgrades
      # the runner's own pip in place and leaves a broken hybrid install
      # (ImportError: InvalidSchemeCombination). Only project dependency
      # resolution belongs on the snapshot.
      env:
        PIP_INDEX_URL: https://:2021-01-23T12%3A58%3A09.936803Z@time-machines-pypi.sealsecurity.io/
      # setuptools<52 (51.3.3 in the snapshot) pairs with the packaging 20.8
      # that tox 3 resolves: a present-day setuptools calls
      # canonicalize_version(strip_trailing_zero=...), which packaging<22 has
      # no such keyword for, so `setup.py sdist` dies in tox's sdist-make.
      run: python -m pip install 'tox<4' nox 'setuptools<52'

    # Main check
    - name: Check vendored packages
      # Release-date index, scoped to this step: at job level it also reaches
      # setup-python's internal `pip install --upgrade pip`, which downgrades
      # the runner's own pip in place and leaves a broken hybrid install
      # (ImportError: InvalidSchemeCombination). Only project dependency
      # resolution belongs on the snapshot.
      env:
        PIP_INDEX_URL: https://:2021-01-23T12%3A58%3A09.936803Z@time-machines-pypi.sealsecurity.io/
      run: python -m tox -e "vendoring"

    - name: Prepare dummy release
      # Release-date index, scoped to this step: at job level it also reaches
      # setup-python's internal `pip install --upgrade pip`, which downgrades
      # the runner's own pip in place and leaves a broken hybrid install
      # (ImportError: InvalidSchemeCombination). Only project dependency
      # resolution belongs on the snapshot.
      env:
        PIP_INDEX_URL: https://:2021-01-23T12%3A58%3A09.936803Z@time-machines-pypi.sealsecurity.io/
      run: nox -s prepare-release -- 99.9

    - name: Generate distributions for the dummy release
      # Release-date index, scoped to this step: at job level it also reaches
      # setup-python's internal `pip install --upgrade pip`, which downgrades
      # the runner's own pip in place and leaves a broken hybrid install
      # (ImportError: InvalidSchemeCombination). Only project dependency
      # resolution belongs on the snapshot.
      env:
        PIP_INDEX_URL: https://:2021-01-23T12%3A58%3A09.936803Z@time-machines-pypi.sealsecurity.io/
      run: nox -s build-release -- 99.9

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.8
      uses: actions/setup-python@v2
      with:
        python-version: 3.8

    # setuptools is pinned to 51.3.3 (the release-date version) on purpose:
    # setuptools >= 70.1 ships its own bdist_wheel that shadows the wheel
    # package's and stamps "Generator: setuptools (79.x)" instead of the
    # published "bdist_wheel (0.36.2)".
    - name: Install build dependencies
      run: >-
        python -m pip install
        --index-url 'https://:2021-01-23T12%3A58%3A09.936803Z@time-machines-pypi.sealsecurity.io/'
        setuptools==51.3.3 wheel==0.36.2

    # setup.cfg carries [bdist_wheel] universal = 1 -> py2.py3-none-any.
    - name: Build sdist and wheel
      run: python setup.py sdist bdist_wheel

    - name: Upload distributions
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  tests:
    name: Tests / ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    needs: dev-tools


    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: [2.7, 3.5, 3.6, 3.7, 3.8, 3.9]
        exclude:
        # macos-latest is arm64: actions/python-versions has no darwin-arm64
        # build for 2.7/3.5/3.6/3.7 and there is no cryptography wheel for
        # them; 3.7's from-source fallback dies in `brew install openssl@1.1`
        # (the formula was deleted).
        - os: macos-latest
          python: 2.7
        - os: macos-latest
          python: 3.5
        - os: macos-latest
          python: 3.6
        - os: macos-latest
          python: 3.7

    steps:
    # Caches
    - name: pip cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('tools/requirements/tests.txt') }}-${{ hashFiles('tools/requirements/docs.txt') }}-${{ hashFiles('tox.ini') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          ${{ runner.os }}-
    # Setup
    # Mirrors tools/travis/setup.sh -- without it the VCS tests cannot commit.
    - name: Set up git credentials
      run: |
        git config --global user.email "distutils-sig@python.org"
        git config --global user.name "pip"
    - uses: actions/checkout@v2
    # Drop-in for actions/setup-python that builds the interpreter from source
    # when no prebuilt exists for the runner's arch.
    - uses: MatteoH2O1999/setup-python@v4
      with:
        python-version: ${{ matrix.python }}
        allow-build: info
        cache-build: true

    # tox-venv is load-bearing: virtualenv 16.x cannot create envs on the
    # current macOS/Windows runners.
    - name: Install tox
      # tox 3: tox.ini uses `whitelist_externals` (renamed in tox 4) and the
      # tests job's tox-venv plugin imports tox.venv, which tox 4 removed.
      # Release-date index, scoped to this step: at job level it also reaches
      # setup-python's internal `pip install --upgrade pip`, which downgrades
      # the runner's own pip in place and leaves a broken hybrid install
      # (ImportError: InvalidSchemeCombination). Only project dependency
      # resolution belongs on the snapshot.
      env:
        PIP_INDEX_URL: https://:2021-01-23T12%3A58%3A09.936803Z@time-machines-pypi.sealsecurity.io/
        # No cryptography wheel for darwin-arm64 / CPython 3.9 on Windows
        # exists in the snapshot.
        PIP_EXTRA_INDEX_URL: https://pypi.org/simple/
      # setuptools<52 (51.3.3 in the snapshot) pairs with the packaging 20.8
      # that tox 3 resolves: a present-day setuptools calls
      # canonicalize_version(strip_trailing_zero=...), which packaging<22 has
      # no such keyword for, so `setup.py sdist` dies in tox's sdist-make.
      run: python -m pip install 'tox<4' tox-venv 'virtualenv<20' 'setuptools<52'

    # Main check
    - name: Run unit tests
      # Release-date index, scoped to this step: at job level it also reaches
      # setup-python's internal `pip install --upgrade pip`, which downgrades
      # the runner's own pip in place and leaves a broken hybrid install
      # (ImportError: InvalidSchemeCombination). Only project dependency
      # resolution belongs on the snapshot.
      env:
        PIP_INDEX_URL: https://:2021-01-23T12%3A58%3A09.936803Z@time-machines-pypi.sealsecurity.io/
        # No cryptography wheel for darwin-arm64 / CPython 3.9 on Windows
        # exists in the snapshot.
        PIP_EXTRA_INDEX_URL: https://pypi.org/simple/
      run: >-
        python -m tox -e py --
        --use-venv
        -m unit
        --verbose
        --numprocesses auto
        ${{ inputs.test-filter }}

    # Integration tests are macOS-only: on windows-latest they produce 60+
    # environment-drift failures unrelated to pip itself.
    - name: Run integration tests
      if: runner.os != 'Windows'
      # Release-date index, scoped to this step: at job level it also reaches
      # setup-python's internal `pip install --upgrade pip`, which downgrades
      # the runner's own pip in place and leaves a broken hybrid install
      # (ImportError: InvalidSchemeCombination). Only project dependency
      # resolution belongs on the snapshot.
      env:
        PIP_INDEX_URL: https://:2021-01-23T12%3A58%3A09.936803Z@time-machines-pypi.sealsecurity.io/
        # No cryptography wheel for darwin-arm64 / CPython 3.9 on Windows
        # exists in the snapshot.
        PIP_EXTRA_INDEX_URL: https://pypi.org/simple/
      run: >-
        python -m tox -e py --
        --use-venv
        -m integration
        --verbose
        --numprocesses auto
        --durations=5
        ${{ inputs.test-filter }}
